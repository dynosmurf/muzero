[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muzero"
version = "0.1.0"
description = "Muzero reinforcement learning algorithm"
authors = [
  { name="Ryan Murphy", email="ryan@devmurphy.com" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]